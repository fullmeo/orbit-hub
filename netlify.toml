# Netlify configuration - redirects to orbit-allysonglado
[build]
  base = "orbit-allysonglado"
  command = "npm install && cp -r public/* . && echo 'Site deployed successfully'"
  publish = "."
  functions = "orbit-allysonglado/netlify/functions"

# Environment variables
[build.environment]
  BREVO_API_KEY = "YOUR_BREVO_API_KEY_HERE"
  BREVO_LIST_ID = "YOUR_BREVO_LIST_ID_HERE"
  BREVO_WELCOME_TEMPLATE_ID = "YOUR_WELCOME_TEMPLATE_ID_HERE"
  GA4_PROPERTY_ID = "G-LS4G24ESNF"
  SPOTIFY_CLIENT_ID = "YOUR_SPOTIFY_CLIENT_ID"
  SPOTIFY_REDIRECT_URI = "https://orbit-allysonglado.netlify.app/callback"
  ANTHROPIC_API_KEY = "YOUR_ANTHROPIC_API_KEY"
  NODE_ENV = "production"
  ARTIST_NAME = "Allyson Glado"
  ARTIST_TONE = "chaleureux, inspirant, accessible, poétique"
  ARTIST_BIO = "Artiste reggae-pop. Émotions brutes, mélodies modernes, énergie live."

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://cdn.brevo.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: https://www.google-analytics.com https://api.brevo.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects for legacy URLs
[[redirects]]
  from = "/blog/*"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/orbit-hub"
  to = "/"
  status = 301

[[redirects]]
  from = "/listen"
  to = "/music.html"
  status = 301

[[redirects]]
  from = "/about-me"
  to = "/about.html"
  status = 301

# Forms
[[form]]
  name = "Email Signup"
  honeypot = true

[[form]]
  name = "Contact Form"
  honeypot = true

# Netlify Functions configuration
[functions]
  node_bundler = "esbuild"

# Analytics
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "lighthouse"

# Monitoring
[monitoring]
  enabled = true
