# Netlify configuration - directs to orbit-allysonglado
[build]
  base = "orbit-allysonglado"
  functions = "netlify/functions"

[build.environment]
  GA4_PROPERTY_ID = "G-LS4G24ESNF"
  ARTIST_NAME = "Allyson Glado"
  ARTIST_TONE = "chaleureux, inspirant, accessible, poétique"
  ARTIST_BIO = "Artiste reggae-pop. Émotions brutes, mélodies modernes, énergie live."
  SPOTIFY_REDIRECT_URI = "https://orbit-allysonglado.netlify.app/callback"
  NODE_ENV = "production"
