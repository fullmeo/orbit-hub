name: Deploy ORBIT Sites

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to deploy (all|allyson-glado|ouidah-jazz|jecd-trio|serigne-diagne)'
        required: false
        default: 'all'

env:
  NODE_VERSION: '18'

jobs:
  detect-changes:
    name: Detect Changed Sites
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Changed Directories
        id: detect
        run: |
          if [[ "${{ github.event.inputs.site }}" != "" ]]; then
            SITES="${{ github.event.inputs.site }}"
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }}...HEAD || echo "")
            SITES=""
            [[ $CHANGED == *"orbit-allysonglado"* ]] && SITES="$SITES allyson-glado"
            [[ $CHANGED == *"Ouidah_jazz"* ]] && SITES="$SITES ouidah-jazz"
            [[ $CHANGED == *"Jecd-trio_orbit-hub"* ]] && SITES="$SITES jecd-trio"
            [[ $CHANGED == *"serigne-diagne_orbit-hub"* ]] && SITES="$SITES serigne-diagne"
            if [[ -z "$SITES" ]]; then
              SITES="all"
            fi
          fi
          echo "sites=$SITES" >> $GITHUB_OUTPUT

  deploy-site:
    name: Deploy ${{ matrix.site }}
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        site: [allyson-glado, ouidah-jazz, jecd-trio, serigne-diagne]
      max-parallel: 1
    if: |
      contains(needs.detect-changes.outputs.sites, matrix.site) ||
      contains(needs.detect-changes.outputs.sites, 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get Site Config
        id: config
        run: |
          CONFIG=$(node -e "
            const config = require('./orbit-sites.config.json');
            const site = config.sites.find(s => s.id === '${{ matrix.site }}');
            if (!site) process.exit(1);
            console.log('dir=' + site.directory);
          ")
          echo "$CONFIG" >> $GITHUB_OUTPUT
      - name: Optional npm build
        run: |
          cd "${{ steps.config.outputs.dir }}"
          if [ -f package.json ]; then
            npm ci --prefer-offline || npm install
            npm run build --if-present
          fi
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './${{ steps.config.outputs.dir }}'
          production-deploy: ${{ github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: Deploy ${{ matrix.site }} from ${{ github.sha }}
          netlify-config-path: './${{ steps.config.outputs.dir }}/netlify.toml'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets[format('NETLIFY_SITE_ID_{0}', matrix.site)] }}
