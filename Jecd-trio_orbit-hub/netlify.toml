# ============================================================
# ORBIT Trio Hub — netlify.toml
# Site statique pur — aucune dépendance à installer
# Backend Python → Railway (séparé)
# ============================================================

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

# ── Contextes : aucune commande Python ───────────────────────
[context.production]
  command = ""

[context.deploy-preview]
  command = ""

[context.branch-deploy]
  command = ""

# ── REDIRECTS ────────────────────────────────────────────────

# Proxy API → Railway
[[redirects]]
  from   = "/api/*"
  to     = "https://orbit-trio-api.railway.app/:splat"
  status = 200
  force  = true

# Trailing slash
[[redirects]]
  from   = "/:path/"
  to     = "/:path"
  status = 301

# SPA fallback — toujours en dernier
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── HEADERS ──────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https://orbit-trio-api.railway.app https://api.stripe.com https://ko-fi.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src blob:;"
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control             = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed    = "/"
