# Netlify configuration - Togbé Adjos Orbit Hub
[build]
  base = "generated-hubs/togbe-adjos-orbit-hub"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  GA4_PROPERTY_ID = "G-TOGBE-ADJOS"
  ARTIST_NAME = "Togbé Adjos"
  ARTIST_TONE = "authentique, mystique, soulful, contemplatif"
  ARTIST_BIO = "Vodun Jazz Pioneer | Fondateur du Vodun Jazz Festival | Ouidah, Benin"
  SPOTIFY_REDIRECT_URI = "https://togbe-adjos.netlify.app/callback"
  NODE_ENV = "production"
